<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hy-MT3 i18n App Localizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090d16; color: #f8fafc; padding: 32px 24px; line-height: 1.55;
    }
    .wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 28px; font-weight: 900; }
    h1 span { color: #ffd400; }
    .badge {
      font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 999px;
      background: rgba(255, 212, 0, 0.14); color: #ffd400; border: 1px solid rgba(255, 212, 0, 0.35);
    }
    .tabs { display: flex; gap: 10px; flex-wrap: wrap; }
    .tab-btn {
      background: #141d2f; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 18px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .tab-btn.active { background: #624aff; color: #fff; border-color: #624aff; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .pane {
      background: #141d2f; border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px;
    }
    .pane-title { font-size: 15px; font-weight: 800; color: #ffd400; }
    .kv-list { display: flex; flex-direction: column; gap: 10px; }
    .kv-item {
      background: #0f1624; border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px; padding: 12px 14px;
    }
    .kv-key { font-family: monospace; font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
    .kv-val { font-size: 14.5px; color: #f8fafc; line-height: 1.65; }
    .var-chip {
      display: inline-block; background: rgba(98, 74, 255, 0.22); color: #c4b5fd;
      border: 1px solid rgba(98, 74, 255, 0.45); border-radius: 6px;
      padding: 1px 7px; font-family: monospace; font-size: 13px; font-weight: 700;
    }
    .lang-panel { display: none; }
    .lang-panel.active { display: flex; flex-direction: column; gap: 10px; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Zero-Breakage <span>i18n App Localizer</span></h1>
      <span class="badge">{{status_badge}}</span>
    </header>
    <div class="tabs">{{lang_tabs}}</div>
    <div class="grid">
      <div class="pane">
        <div class="pane-title">Source Locale (English)</div>
        <div class="kv-list">{{source_cards}}</div>
      </div>
      <div class="pane">
        <div class="pane-title">Localized Output (Structure-Locked)</div>
        {{target_panels}}
      </div>
    </div>
  </div>
  <script>
    function showLang(idx) {
      document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
      document.querySelectorAll('.lang-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
    }
  </script>
</body>
</html>
