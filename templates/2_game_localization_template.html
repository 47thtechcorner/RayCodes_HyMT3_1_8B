<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hy-MT3 Game Localization QA Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090d16; color: #f8fafc; padding: 32px 24px; line-height: 1.55;
    }
    .wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 28px; font-weight: 900; }
    h1 span { color: #ffd400; }
    .badge {
      font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 999px;
      background: rgba(98, 74, 255, 0.18); color: #c4b5fd; border: 1px solid rgba(98, 74, 255, 0.4);
    }
    .glossary-bar {
      display: flex; gap: 12px; flex-wrap: wrap; background: #141d2f;
      border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; padding: 14px 18px;
    }
    .g-pill {
      font-size: 13.5px; font-weight: 700; background: #0f1624;
      border: 1px solid rgba(255,212,0,0.3); color: #ffd400; padding: 5px 12px; border-radius: 8px;
    }
    .qa-list { display: flex; flex-direction: column; gap: 16px; }
    .qa-card {
      background: #141d2f; border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px;
    }
    .qa-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .qa-lang { font-size: 15px; font-weight: 800; color: #ffd400; }
    .qa-check { font-size: 13px; font-weight: 700; color: #34d399; background: rgba(52,211,153,0.12); padding: 4px 10px; border-radius: 999px; }
    .qa-check.warn { color: #fbbf24; background: rgba(251,191,36,0.12); }
    .qa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .qa-box {
      background: #0f1624; border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px; padding: 14px; font-size: 14px; color: #e2e8f0;
      display: flex; flex-direction: column; gap: 10px;
    }
    .qa-line {
      background: #141d2f; border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px; padding: 10px 12px; line-height: 1.6;
    }
    .var-chip {
      display: inline-block; background: rgba(56, 189, 248, 0.16); color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 6px;
      padding: 1px 7px; font-family: monospace; font-size: 13px; font-weight: 700;
    }
    .qa-box-label { font-size: 13px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; }
    @media (max-width: 820px) { .qa-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Game Rich-Text &amp; <span>Glossary QA Studio</span></h1>
      <span class="badge">{{status_badge}}</span>
    </header>
    <div class="glossary-bar">{{glossary_pills}}</div>
    <div class="qa-list">{{qa_cards}}</div>
  </div>
</body>
</html>
