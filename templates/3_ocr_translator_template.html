<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hy-MT3 Noisy OCR Recovery Inspector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090d16; color: #f8fafc; padding: 32px 24px; line-height: 1.55;
    }
    .wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 28px; font-weight: 900; }
    h1 span { color: #ffd400; }
    .badge {
      font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 999px;
      background: rgba(255, 212, 0, 0.14); color: #ffd400; border: 1px solid rgba(255, 212, 0, 0.35);
    }
    .split { display: grid; grid-template-columns: 360px 1fr 1fr; gap: 18px; }
    .pane {
      background: #141d2f; border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px;
    }
    .pane-title { font-size: 15px; font-weight: 800; color: #ffd400; }
    .receipt-img { width: 100%; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
    .line-card {
      background: #0f1624; border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px; padding: 10px 12px; font-size: 14px; color: #e2e8f0;
    }
    @media (max-width: 980px) { .split { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Noisy OCR <span>Recovery Inspector</span></h1>
      <span class="badge">{{status_badge}}</span>
    </header>
    <div class="split">
      <div class="pane">
        <div class="pane-title">Source Receipt Image</div>
        <img class="receipt-img" src="{{image_path}}" alt="Scanned receipt input" />
      </div>
      <div class="pane">
        <div class="pane-title">Raw RapidOCR Output</div>
        {{raw_ocr_cards}}
      </div>
      <div class="pane">
        <div class="pane-title">Hy-MT3 Cleaned Translation (Korean)</div>
        {{translated_cards}}
      </div>
    </div>
  </div>
</body>
</html>
